# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_finance_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

# Google OAuth (Secrets moved to environment variables for security)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-google-client-secret}

# JWT
jwt.secret=${JWT_SECRET_KEY:local-dev-jwt-secret-key-for-diplom-work-2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Stats Data Generation
stat.uz.api.enabled=true
cbu.uz.api.enabled=true
